<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="절마다 작은 코멘트를 남기고 함께 읽는 교환일기 성경책" />
  <title>Bible Journaling Together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Noto+Serif+KR:wght@500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="reader-app.css?v=20260702-01" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#reader" aria-label="Bible Journaling Together">
      <span class="brand-icon" aria-hidden="true"></span>
      <span>
        <strong>Bible Journaling Together</strong>
        <small>함께 말씀을 읽고, 나누고, 기록합니다</small>
      </span>
    </a>
    <nav class="main-nav" aria-label="주요 메뉴">
      <a class="is-active" href="#reader">성경읽기</a>
      <a href="#journal">저널</a>
      <a href="#comments">커뮤니티</a>
      <a href="#notes">나의 노트</a>
    </nav>
    <form class="search" id="searchForm">
      <input id="searchInput" type="search" placeholder="구절, 키워드 검색" autocomplete="off" />
      <button type="submit" aria-label="검색">⌕</button>
    </form>
  </header>

  <main class="layout" id="reader">
    <section class="reader-area">
      <div class="reader-controls">
        <select id="bookSelect" aria-label="성경 권 선택"></select>
        <button type="button" id="prevChapter" aria-label="이전 장">‹</button>
        <select id="chapterSelect" aria-label="장 선택"></select>
        <button type="button" id="nextChapter" aria-label="다음 장">›</button>
        <span class="reader-tools" aria-label="읽기 도구">
          <button type="button" id="copyVerseButton">책갈피</button>
          <button type="button" disabled>메모</button>
          <button type="button" disabled>하이라이트</button>
        </span>
      </div>

      <div class="book-frame">
        <article class="book-page page-left">
          <header>
            <h1 id="chapterTitle">창세기 1장</h1>
            <p id="chapterSubtitle">절마다 남겨진 작은 물방울</p>
          </header>
          <div class="verses" id="leftVerses"></div>
          <footer id="leftPageNo">1</footer>
        </article>
        <article class="book-page page-right">
          <div class="verses" id="rightVerses"></div>
          <footer id="rightPageNo">2</footer>
        </article>
      </div>

      <div class="bottom-controls">
        <button type="button" id="firstChapter">처음으로</button>
        <button type="button" id="prevSpread">‹</button>
        <span id="progressText">1 / 1189</span>
        <button type="button" id="nextSpread">›</button>
        <button type="button" id="lastChapter">마지막으로</button>
      </div>
      <p class="status" id="statusText" aria-live="polite"></p>
    </section>

    <aside class="side-panel" id="journal">
      <div class="panel-tabs">
        <button class="is-active" type="button">코멘트</button>
        <button type="button">북마크</button>
      </div>

      <section class="selected-card">
        <p class="selected-ref" id="selectedRef">창세기 1장 1절</p>
        <blockquote id="selectedText"></blockquote>
      </section>

      <section class="comments-card" id="comments">
        <div class="section-head">
          <h2>이 절에 남겨진 물방울</h2>
          <span id="commentCount">0</span>
        </div>
        <div class="comment-list" id="commentList"></div>
      </section>

      <form class="comment-form" id="commentForm">
        <textarea id="commentInput" rows="4" maxlength="1000" placeholder="이 절에 대한 코멘트를 남겨보세요." required></textarea>
        <div class="form-row">
          <label><input id="anonymousCheck" type="checkbox" checked /> 익명으로 작성</label>
          <button type="submit">등록</button>
        </div>
      </form>

      <section class="notes-card" id="notes">
        <h2>함께 열어볼 말씀</h2>
        <div id="togetherList" class="together-list"></div>
      </section>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="reader-app.js?v=20260702-01"></script>
</body>
</html>
